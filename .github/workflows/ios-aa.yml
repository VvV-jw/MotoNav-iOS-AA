name: Build iOS aa unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-aa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated project and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/ios/logs
          python3 scripts/validate-ios-project.py | tee output/ios/logs/project-validation.log
          {
            xcodebuild -version
            swift --version
            ruby --version
            printf 'Commit: %s\n' "$GITHUB_SHA"
          } > output/ios/logs/toolchain.log 2>&1
      - name: Run all Swift regression suites
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-ios.sh 2>&1 | tee output/ios/logs/tests.log
      - name: Capture production preparation component in iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/capture-preparation-previews.sh 2>&1 | tee output/ios/logs/preparation-preview.log
      - name: Keep simulator previews
        uses: actions/upload-artifact@v4
        with:
          name: motonav-ios-aa-previews-${{ github.run_number }}
          path: output/ios/previews/
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          gem install cocoapods --version 1.16.2 --no-document --user-install
          printf '%s/bin\n' "$(ruby -r rubygems -e 'puts Gem.user_dir')" >> "$GITHUB_PATH"
      - name: Install locked iOS dependencies
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            pod _1.16.2_ install --deployment 2>&1 | tee ../output/ios/logs/pods.log
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'curl:|Connection reset|timed out|TLS|SSL|HTTP.*(500|502|503|504)' ../output/ios/logs/pods.log; then exit "$result"; fi
            printf 'Transient dependency transfer failed; retrying locked dependencies (%s/3).\n' "$attempt"
            sleep 3
          done
      - name: Build unsigned iPhone IPA
        shell: bash
        env:
          MOTONAV_DERIVED_DATA: ${{ runner.temp }}/MotoNav-aa-DerivedData
        run: bash scripts/build-ios-ipa.sh
      - name: Keep unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: motonav-ios-aa-unsigned-${{ github.run_number }}
          path: |
            output/ios/*-unsigned.ipa
            output/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Keep logs and synthetic protocol samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motonav-ios-aa-logs-${{ github.run_number }}
          path: |
            output/ios/logs/
            .build/tests/aa-raster/*.bin
            .build/tests/gta-vector/*.bin
            .build/tests/**/*.json
            output/ios/previews/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
